# Jacowitz & Kahneman (1995), "Measures of Anchoring in Estimation Tasks",
# Personality and Social Psychology Bulletin 21(11):1161-1166, Table 1.
# Anchors are the ORIGINAL human-calibrated values (15th/85th percentiles of the
# calibration group's estimates) -- do NOT re-percentile these for the model; the
# whole point of the bridge arm is an identical stimulus for a direct human-AI
# comparison (RQ2b/RQ5). human_ai is the published per-item anchoring index.
# All values transcribed from the primary source (verified 2026-07-18).
source: "Jacowitz & Kahneman 1995, Table 1 (PSPB 21(11):1161-1166)"
